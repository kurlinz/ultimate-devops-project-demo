# CI for AD Service

name: ad-ci

on:
    pull_request:
      branches:
        - main
    push:
        branches:
          - feature/ci

jobs:
    docker-build:
        runs-on: ubuntu-latest

        steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: install docker buildx
          uses: docker/setup-buildx-action@v2

        - name: docker login
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_TOKEN }}

        - name: docker build and push
          uses: docker/build-push-action@v6
          with:
            context: /src/ad
            file: Dockerfile
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/ad-service:${{ github.run_id }}

        - name: verify image was pushed
          run: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/ad-service:${{ github.run_id }}

    update-k8s:
        runs-on: ubuntu-latest

        needs: docker-build

        steps:
        - name: checkout code
          uses: actions/checkout@v4
          with:
            token: ${{ secrets.GITHUB_TOKEN }}

        - name: Update tag in kubernetes deployment manifest
          run: | 
               sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/ad:${{github.run_id}}|" kubernetes/productcatalog/deploy.yaml
        
        - name: Commit and push changes
          run: |
            git config --global user.email "${{ github.actor }}@users.noreply.github.com"
            git config --global user.name "${{ github.actor }}"
            git add kubernetes/productcatalog/deploy.yaml
            git commit -m "[CI]: Update ad image tag"
            git push origin HEAD:feature/ci